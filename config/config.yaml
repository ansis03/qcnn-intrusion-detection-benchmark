# 실험 전체 설정 — 여기만 바꾸면 모든 실험 조건 변경됨

data:
  raw_train: "data/raw/KDDTrain+.txt"
  raw_test:  "data/raw/KDDTest+.txt"
  processed_dir: "data/processed/"
  n_qubits: 8            # PCA 후 차원 = qubit 수 (QCNN 회로 고정값)
  label: binary          # binary | multiclass
  random_seed: 42

experiment:
  n_train_sizes: [50, 100, 500, 1000, 5000]
  n_repeats: 5           # 각 N에서 반복 횟수
  test_size: 5000        # 고정 test set 크기

models:
  qcnn:
    n_qubits: 8
    n_layers: 2          # convolutional block 반복 수
    encoding: angle      # angle | amplitude
    optimizer: adam
    lr: 0.01
    n_epochs: 100
    batch_size: 32
  cnn:
    n_filters: 8
    kernel_size: 3
    optimizer: adam
    lr: 0.001
    n_epochs: 100
    batch_size: 32
  svm:
    kernel: rbf
    C: 1.0

output:
  results_dir: "results/raw/"
  figures_dir: "figures/"
  summary_dir: "results/summary/"
